[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seneschal"
version = "0.1.0"
description = "A storyteller for one player. The model tells the story; the code keeps the notebook and rolls the dice."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["seneschal*"]

[tool.setuptools.package-data]
seneschal = ["web/*", "content/stories/*.toml", "content/characters/*.toml"]
