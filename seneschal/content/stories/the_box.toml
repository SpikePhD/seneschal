title = "The Box"
default_name = "The Box"
kicker = "One night in Chicago"
pitch = "Deliver a sealed box across the city before three, and do not open it."
briefing = "A sealed steel box, a stranger's fee, and a crypt across the city by three."
premise = "Harlan Voss has paid you to carry a sealed steel box to Sister Agnes in the crypt under St. Brigid's before 03:00. Do not open it. Do not ask. Half the fee is already in your pocket."
spine = "A courier is handed something dangerous by someone who considers them disposable. The question of the night is what Alex does upon finding that out: deliver, betray, bargain or run. Every path should cost something, and Voss, Agnes and the Sheriff should all still matter at the end."
tone = "Rain-wet modern noir. Quiet menace, dry humour, and consequences that stick."
opening = """The rain has been at it since sundown. An hour ago, in an office that smelled of paper and old money, Harlan Voss slid a steel box across his desk and counted half your fee beside it. "St. Brigid's. The crypt. Sister Agnes, before three." He did not look up. "It is sealed. It stays sealed. You will not be paid to be curious."

Now it's on your table in Pilsen, heavier than it has any right to be, and very slightly cold. The van is outside. The night is young, by your standards. What do you do?"""
start_minute = 1395  # 23:15

journal = [
    "Voss's terms: the crypt under St. Brigid's, before 03:00. Sealed on arrival. No questions.",
    "Half paid. The other half on delivery.",
]

facts = [
    "The box is the size of a large shoebox and weighs about twenty kilos. The lid is sealed with lead.",
]

