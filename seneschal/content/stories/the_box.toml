[secrets.box_contents]
truth = "Inside is a glass cylinder of elder vitae, stolen from the Prince's own reserve, packed in cold gel. A mercury tilt switch and a small battery are wired to a thermite charge beneath it. An x-ray shows a cylinder, wiring, a battery, a small glass bulb, and a dense block beneath them. Forcing the lid or tipping the box past about forty-five degrees sets off the charge: it burns the vitae and whoever is holding the box (Aggravated damage)."
reveal_when = "An x-ray or similar shows the shapes. Understanding the switch and charge takes an expert or a good Technology or Science roll. Identifying the blood as elder vitae needs a taste, a Blood Sorcery ritual, or a confession from Voss."

[secrets.the_setup]
truth = "Voss stole the vitae and tipped off the Sheriff. The Sheriff's people will raid the crypt at 03:00 and find the stolen vitae in Sister Agnes's hands, carried by a courier nobody will miss. That destroys Agnes's flock and clears Voss's path at court. The thermite is there so that, if things go wrong, the evidence and the courier burn together."
reveal_when = "Confronting Voss with leverage, overhearing the Sheriff's people, or persuading Rook that she is being used."

[secrets.rook_tail]
truth = "Rook has been following Alex since Voss's office, from a grey sedan, and reports every stop to the Sheriff."
reveal_when = "An Awareness or Streetwise roll on the road, or any careful check for a tail. She can be spotted, shaken or spoken to."

[clocks.deadline]
name = "Delivery by 03:00"
segments = 15
per_minutes = 15
public = true
on_full = "It is 03:00. The Sheriff's raid hits St. Brigid's whether or not the box is there. Agnes will blame Alex if she survives, and Voss will call the contract broken."

[clocks.sheriff_attention]
name = "The Sheriff's attention"
segments = 6
on_full = "The Sheriff stops watching and acts. Rook, or someone worse, comes for Alex and the box directly."

[clocks.masquerade]
name = "Masquerade heat"
segments = 6
on_full = "Mortal police or the press connect something to Alex. The court notices, and every Kindred ally goes quiet."

